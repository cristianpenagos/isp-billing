services:
  # Base de datos PostgreSQL para desarrollo local
  postgres:
    image: postgres:16-alpine
    container_name: isp-billing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: isp_billing_dev
      POSTGRES_USER: isp_user
      POSTGRES_PASSWORD: isp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp_user -d isp_billing_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PgAdmin opcional para inspeccionar la BD via interfaz web
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: isp-billing-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
