spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/isp_billing_dev
    username: isp_user
    password: isp_password
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.wixnetworks.isp: DEBUG
    org.springframework.web: DEBUG
