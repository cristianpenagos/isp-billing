name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build, Test y Quality Gates
    runs-on: ubuntu-latest

    # PostgreSQL arrancado como service container por el runner.
    # Esto evita el problema de Docker-in-Docker con Testcontainers.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: isp_billing_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Variables que la clase AbstractPostgresIT lee para saber que esta en CI
    env:
      CI_POSTGRES_URL: jdbc:postgresql://localhost:5432/isp_billing_test
      CI_POSTGRES_USER: test
      CI_POSTGRES_PASSWORD: test

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Necesario para que SonarCloud analice historial completo

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verificar PostgreSQL disponible
        # El runner ya arranco el service container, verificamos que responde
        run: |
          until pg_isready -h localhost -p 5432 -U test; do
            echo "Esperando a PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL listo"

      - name: Cache de paquetes SonarCloud
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Compilar proyecto
        run: mvn -B clean compile

      - name: Ejecutar tests unitarios y de integracion
        # verify incluye compile, test (unitarios), integration-test (IT), verify
        # Los IT usaran el PostgreSQL del service container via CI_POSTGRES_URL
        run: mvn -B verify

      - name: Subir reporte JaCoCo como artefacto
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Analizar con SonarCloud
        # Solo corre si los tests pasaron (los steps anteriores no fallaron)
        if: success() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            mvn -B sonar:sonar \
              -Dsonar.projectKey=cristianpenagos_isp-billing \
              -Dsonar.organization=cristianpenagos \
              -Dsonar.host.url=https://sonarcloud.io
          else
            echo "SONAR_TOKEN no configurado, saltando analisis"
          fi

  docker-build:
    name: Build de imagen Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v5

      - name: Build imagen Docker (verificacion)
        run: docker build -t isp-billing:${{ github.sha }}