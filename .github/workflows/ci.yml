name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build, Test y Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para SonarCloud (analiza historial)

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache de paquetes SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Compilar proyecto
        run: mvn -B clean compile

      - name: Ejecutar tests unitarios
        run: mvn -B test

      - name: Ejecutar tests de integracion
        run: mvn -B verify -DskipUnitTests

      - name: Generar reporte JaCoCo
        run: mvn -B jacoco:report

      - name: Subir cobertura como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Analizar con SonarCloud
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            mvn -B sonar:sonar \
              -Dsonar.projectKey=tu-proyecto-key \
              -Dsonar.organization=tu-organizacion-sonar
          else
            echo "SONAR_TOKEN no configurado, saltando analisis"
          fi

  docker-build:
    name: Build de imagen Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Build imagen Docker
        run: docker build -t isp-billing:${{ github.sha }} .

      - name: Verificar que la imagen arranca
        run: |
          docker run -d --name test-container \
            -e SPRING_PROFILES_ACTIVE=test \
            isp-billing:${{ github.sha }}
          sleep 10
          docker logs test-container
          docker stop test-container
