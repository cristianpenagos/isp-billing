# Configuracion de Render como Infrastructure as Code
# Documentacion: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: isp-billing-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false  # Pegar manualmente desde Supabase
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Pegar URL de Vercel cuando exista
